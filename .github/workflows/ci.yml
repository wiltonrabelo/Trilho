# Trilho — CI: qualidade, E2E RF-08, SBOM e instalador.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

defaults:
  run:
    working-directory: .

jobs:
  quality:
    name: Lint e testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Instalar dependências npm
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Vitest
        run: npm run test

      - name: Clippy + testes Rust
        run: npm run test:rust

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --manifest-path src-tauri/Cargo.toml

  e2e:
    name: E2E (smoke + RF-08)
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências npm
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: E2E Playwright
        run: npm run test:e2e

  sbom:
    name: SBOM CycloneDX
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências npm
        run: npm ci

      - name: SBOM npm
        run: npx --yes @cyclonedx/cyclonedx-npm@4.0.0 --output-file sbom-npm.cdx.json

      - name: SBOM cargo
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked
          Push-Location src-tauri
          cargo cyclonedx --format json
          Pop-Location
          $bom = Get-ChildItem -Path src-tauri -Filter "*.cdx.json" -Recurse | Select-Object -First 1
          if (-not $bom) { $bom = Get-ChildItem -Path src-tauri -Filter "bom.json" -Recurse | Select-Object -First 1 }
          if (-not $bom) { throw "SBOM cargo não gerado" }
          Copy-Item $bom.FullName sbom-cargo.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: trilho-sbom
          path: |
            sbom-npm.cdx.json
            sbom-cargo.cdx.json
          if-no-files-found: error

  # Instalador: job separado — mais lento; não bloqueia PRs.
  build-installer:
    name: Build instalador
    runs-on: windows-latest
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências npm
        run: npm ci

      - name: Build Tauri (NSIS + MSI)
        run: npm run tauri build

      - name: Checksums SHA-256
        shell: pwsh
        run: |
          $paths = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          )
          if (-not $paths -or $paths.Count -eq 0) {
            Write-Host "Nenhum instalador encontrado — pulando checksums"
            exit 0
          }
          $lines = foreach ($f in $paths) {
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $f.Name
          }
          $lines | Set-Content -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Assinar instalador (opcional EV)
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          # Secrets WINDOWS_CERT_PFX (base64) + WINDOWS_CERT_PASSWORD. Sem secrets = unsigned (THREAT_MODEL §5).
          if (-not $env:WINDOWS_CERT_PFX) { Write-Host "Sem WINDOWS_CERT_PFX — mantém unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "trilho-code-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe não encontrado no runner" }
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe","src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar $($_.Name)" }
          }

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: trilho-installer-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
          if-no-files-found: warn
